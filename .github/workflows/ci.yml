name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Optimized images and downloaded fonts. Entries are content-hashed, so restoring
      # the latest cache is safe; a new key each run keeps it up to date.
      - uses: actions/cache@v6.1.0
        with:
          path: |
            node_modules/.astro/assets
            node_modules/.astro/fonts
          key: astro-${{ runner.os }}-${{ github.run_id }}
          restore-keys: astro-${{ runner.os }}-
      - run: pnpm build
      # Local wrangler (devDependency) is restored from the pnpm store cache.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler pages deploy dist --project-name=tmdn --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
